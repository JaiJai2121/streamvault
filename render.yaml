services:
  - type: web
    name: streamvault
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/data
      - key: RECORDINGS_DIR
        value: /var/data/recordings
    disk:
      name: streamvault-data
      mountPath: /var/data
      sizeGB: 10
