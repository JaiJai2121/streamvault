<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Burst Recording Service">
  <defs>
    <linearGradient id="burstStroke" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25f4ee" />
      <stop offset="0.52" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#fe2c55" />
    </linearGradient>
    <radialGradient id="burstCore" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#e9f9ff" />
      <stop offset="1" stop-color="#25f4ee" />
    </radialGradient>
    <filter id="burstGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="214" fill="#050506" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#burstStroke)" stroke-width="12" opacity="0.95" />
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#burstStroke)" stroke-width="2" opacity="0.35" />

  <g filter="url(#burstGlow)">
    <path
      d="M256 74 287.5 197.2 406 158.6 326.6 256 406 353.4 287.5 314.8 256 438 224.5 314.8 106 353.4 185.4 256 106 158.6 224.5 197.2Z"
      fill="url(#burstStroke)"
    />
  </g>

  <circle cx="256" cy="256" r="58" fill="#050506" />
  <circle cx="256" cy="256" r="34" fill="url(#burstCore)" />
  <circle cx="256" cy="256" r="12" fill="#050506" opacity="0.85" />
</svg>
